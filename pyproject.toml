[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-or-noise"
version = "1.0.0"
description = "Signal or Noise: data analysis case studies in Python and R"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
# Exact pins: this is an analysis repository, so every result must be reproducible
dependencies = [
    "numpy==1.26.4",
    "pandas==2.1.4",
    "scipy==1.15.3",
    "statsmodels==0.14.5",
    "scikit-learn==1.6.1",
    "matplotlib==3.10.0",
    "pyarrow==20.0.0",
    "kagglehub==1.0.2",
    "duckdb==1.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-cov==6.2.1",
    "ruff==0.15.17",
    "nbformat==5.10.4",
    "nbclient==0.10.4",
    "nbconvert==7.17.1",
    "ipykernel==6.29.5",
]

[tool.setuptools.packages.find]
where = [
    "03-nba-winning-performances/src",
]

[tool.pytest.ini_options]
testpaths = [
    "03-nba-winning-performances/tests",
]
addopts = "-q --strict-markers"
markers = ["data: needs a project's downloaded or bundled dataset"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "B018", "E702", "E703"]
