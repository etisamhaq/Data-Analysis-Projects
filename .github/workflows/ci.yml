name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python - lint, tests, notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pinned dependencies and project packages
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # Datasets too large for the repo are downloaded once per pinned version and cached
      - name: Cache NBA data (Kaggle version 552)
        uses: actions/cache@v4
        with:
          path: 03-nba-winning-performances/data
          key: nba-team-statistics-v552

      - name: Download data
        run: |
          [ -f 03-nba-winning-performances/data/TeamStatistics.csv ] || python 03-nba-winning-performances/download_data.py

      - name: Unit and data-validation tests
        run: pytest

      - name: Re-run every notebook from a clean kernel
        run: python tools/run_notebooks.py
